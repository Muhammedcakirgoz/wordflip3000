<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="900" cy="400" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="800" cy="80" r="60" fill="#ffffff" opacity="0.08"/>
  
  <!-- Left Section - Icon -->
  <g transform="translate(120, 140)">
    <!-- Book -->
    <g filter="url(#shadow)">
      <path d="M 0 20 Q 0 0 20 0 L 100 0 L 100 200 L 20 200 Q 0 200 0 180 Z" 
            fill="#ffffff" opacity="0.95"/>
      <path d="M 120 0 L 200 0 Q 220 0 220 20 L 220 180 Q 220 200 200 200 L 120 200 Z" 
            fill="#ffffff" opacity="0.95"/>
      <rect x="100" y="0" width="20" height="200" fill="#f5f5f5"/>
      <line x1="110" y1="0" x2="110" y2="200" stroke="#e0e0e0" stroke-width="2"/>
    </g>
    
    <!-- Text on book -->
    <text x="55" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
          fill="#667eea" text-anchor="middle">EN</text>
    <text x="165" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
          fill="#764ba2" text-anchor="middle">TR</text>
    
    <!-- Stars -->
    <g transform="translate(180, 20) scale(0.8)">
      <path d="M 0,-20 L 5,-5 L 22,-5 L 8,4 L 14,19 L 0,8 L -14,19 L -8,4 L -22,-5 L -5,-5 Z" 
            fill="#ffd700" filter="url(#glow)"/>
    </g>
    <g transform="translate(35, 25) scale(0.5)">
      <path d="M 0,-20 L 5,-5 L 22,-5 L 8,4 L 14,19 L 0,8 L -14,19 L -8,4 L -22,-5 L -5,-5 Z" 
            fill="#ffd700" filter="url(#glow)"/>
    </g>
  </g>
  
  <!-- Center/Right Section - Text -->
  <g transform="translate(400, 180)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
          fill="#ffffff" filter="url(#shadow)">WordFlip 3000</text>
    
    <!-- Subtitle -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="32" font-weight="normal" 
          fill="#ffffff" opacity="0.95">İngilizce Kelime Öğrenme</text>
    
    <!-- Features -->
    <g transform="translate(0, 100)">
      <!-- Feature 1 -->
      <circle cx="0" cy="0" r="8" fill="#ffd700" filter="url(#glow)"/>
      <text x="20" y="6" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.9">1000+ Kelime</text>
      
      <!-- Feature 2 -->
      <circle cx="180" cy="0" r="8" fill="#ffd700" filter="url(#glow)"/>
      <text x="200" y="6" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.9">5 Seviye (A1-C1)</text>
      
      <!-- Feature 3 -->
      <circle cx="420" cy="0" r="8" fill="#ffd700" filter="url(#glow)"/>
      <text x="440" y="6" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.9">Offline</text>
    </g>
  </g>
  
  <!-- Sparkles -->
  <circle cx="850" cy="150" r="3" fill="#ffffff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="920" cy="180" r="2.5" fill="#ffffff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="780" cy="300" r="4" fill="#ffffff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="500" cy="80" r="3.5" fill="#ffffff" opacity="0.7" filter="url(#glow)"/>
  <circle cx="350" cy="420" r="3" fill="#ffffff" opacity="0.6" filter="url(#glow)"/>
</svg>